# VoiceWeb Agent — Render Blueprint
# Connect this GitHub repo in Render → New → Blueprint
# Set GEMINI_API_KEY in the Render dashboard (never commit it).

services:
  - type: web
    name: voiceweb-agent
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: browser-profile
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "3000"
      - key: HEADLESS
        value: "true"
      - key: BROWSER_USER_DATA_DIR
        value: /var/data/browser-profile
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
